<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquidaciones de tarjeta · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Sin diseño aprobado todavía: lista por mes como Libros de IVA y panel derecho como Servicios. -->
<body data-pagina="liquidaciones" data-titulo="Liquidaciones de tarjeta">

  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <main id="principal" class="flex-1 xl:grid xl:grid-cols-[minmax(0,1fr)_380px]">
        <section class="@container flex min-w-0 flex-col gap-4 p-4 sm:px-8 sm:py-6" aria-label="Liquidaciones de tarjeta del mes">
          <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-1">
              <button type="button" id="mes-anterior" class="btn btn-secundario size-9 p-0" aria-label="Mes anterior"></button>
              <button type="button" id="mes-siguiente" class="btn btn-secundario size-9 p-0" aria-label="Mes siguiente"></button>
            </div>
            <h2 id="titulo-mes" class="text-xl first-letter:uppercase"></h2>
            <label class="campo-caja h-9 min-h-0 w-auto text-sm">
              <span class="sr-only">Elegir mes</span>
              <input id="mes" type="month" class="tabular-nums">
            </label>
          </div>

          <div class="tarjeta overflow-hidden rounded-grande">
            <div class="grid grid-cols-[minmax(0,1fr)_104px] items-center gap-3 px-4 @2xl:grid-cols-[56px_minmax(0,1fr)_80px_72px_72px_88px_96px] h-9 border-b border-borde-default bg-fondo-sutil text-13 font-semibold text-texto-secundario" aria-hidden="true">
              <span class="@max-2xl:hidden">Fecha</span><span>Banco y documento</span><span class="text-right @max-2xl:hidden">Liquidado</span><span class="text-right @max-2xl:hidden">Anticipo</span><span class="text-right @max-2xl:hidden">Comisión</span><span class="text-right">Depositado</span><span class="text-right @max-2xl:hidden">Estado</span>
            </div>
            <div id="lista"></div>
            <div id="lista-estado" class="hidden px-4 py-10 text-center text-texto-secundario"></div>
            <div id="totales" class="hidden min-h-12 border-t border-borde-default bg-fondo-sutil py-2 text-15 font-semibold tabular-nums"></div>
          </div>
          <p class="px-1 text-13 text-texto-secundario">Lo cobrado con tarjeta entró a Caja; la liquidación del banco lo pasa a su cuenta. La comisión registra su CCF como compra de gasto.</p>
        </section>

        <!-- Panel derecho: detalle o formulario. En pantallas angostas se abre encima de la lista. -->
        <div id="fondo-panel" class="fixed inset-0 z-30 hidden bg-neutro-900/50 xl:hidden"></div>
        <aside id="panel" class="fixed inset-y-0 right-0 z-40 hidden w-full flex-col overflow-y-auto border-l border-borde-default bg-fondo-superficie sm:w-[400px] xl:sticky xl:top-16 xl:z-auto xl:flex xl:h-[calc(100dvh-4rem)] xl:w-auto" aria-label="Detalle de la liquidación"></aside>
      </main>
    </div>
  </div>

  <script type="module" src="js/controllersWeb/liquidacionesController.js"></script>
</body>
</html>
