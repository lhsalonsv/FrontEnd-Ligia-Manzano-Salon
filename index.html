<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-dvh lg:grid lg:grid-cols-[520px_1fr]">

  <!-- Panel de marca (solo en pantallas anchas) -->
  <aside class="relative hidden flex-col items-center justify-center gap-6 bg-lateral-fondo p-12 text-neutro-400 lg:flex">
    <img src="img/logo-negativo.svg" alt="Ligia Manzano Salón" class="h-auto w-60">
    <p class="tracking-wide">Sistema administrativo</p>
    <small class="absolute bottom-8 text-13 text-neutro-500">© 2026 Ligia Manzano Salón</small>
  </aside>

  <main class="relative flex min-h-dvh flex-col items-center justify-center bg-fondo-superficie px-6 py-16">
    <img src="img/isotipo-negativo.svg" alt="Ligia Manzano Salón" class="mb-8 w-16 rounded-medio bg-lateral-fondo p-2 lg:hidden">

    <form id="form-login" class="flex w-full max-w-sm flex-col gap-6" novalidate>
      <div>
        <h1 class="text-2xl">Iniciar sesión</h1>
        <p class="mt-1 text-texto-secundario">Entra con el usuario que te asignó la administradora.</p>
      </div>

      <!-- Mensaje de error o de sesión cerrada (lo llena el controlador) -->
      <div id="login-aviso" class="aviso hidden" role="alert"></div>

      <div class="flex flex-col gap-4">
        <div>
          <label for="nombre-usuario" class="campo-etiqueta">Usuario</label>
          <div class="campo-caja min-h-12 text-base" data-campo="nombre_usuario">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="nombre-usuario" name="nombreUsuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
        </div>
        <div>
          <label for="contrasena" class="campo-etiqueta">Contraseña</label>
          <div class="campo-caja min-h-12 text-base">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
            <button type="button" id="btn-ver-contrasena" class="inline-flex items-center gap-1.5 text-sm font-semibold text-texto-secundario hover:text-texto-principal" aria-controls="contrasena" aria-pressed="false">
              <span id="ver-icono"></span><span id="ver-texto">Mostrar</span>
            </button>
          </div>
          <p id="aviso-mayus" class="campo-ayuda hidden items-center gap-1.5 text-estado-aviso">Bloq Mayús está activado</p>
        </div>
      </div>

      <button type="submit" id="btn-entrar" class="btn btn-primario btn-grande w-full">Entrar</button>

      <p class="text-sm text-texto-secundario">¿Olvidaste tu contraseña? <b class="font-semibold text-texto-principal">Pídele a la administradora que la restablezca.</b></p>
    </form>

    <p class="absolute bottom-8 flex flex-wrap justify-center gap-x-4 px-6 text-13 text-texto-secundario">
      <span>La sesión se cierra sola tras 30 minutos sin uso.</span><span>Versión 1.0</span>
    </p>
  </main>

  <script type="module" src="js/controllersWeb/loginController.js"></script>
</body>
</html>
