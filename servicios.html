<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicios · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Referencia visual: ../diseno/pantallas/servicios.html (Catálogo, Nuevo servicio) -->
<body data-pagina="servicios" data-titulo="Servicios">

  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <main class="flex-1 xl:grid xl:grid-cols-[minmax(0,1fr)_380px]">
        <!-- Catálogo -->
        <section class="@container flex min-w-0 flex-col gap-3 p-4 sm:px-8 sm:py-6" aria-label="Catálogo de servicios">
          <div class="flex flex-wrap items-center gap-3">
            <h2 class="text-xl">Catálogo de servicios</h2>
            <p id="resumen" class="text-15 text-texto-secundario tabular-nums"></p>
            <label class="campo-caja ml-auto h-10 min-h-0 w-full sm:w-64">
              <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span class="sr-only">Buscar servicio</span>
              <input id="buscar" type="search" placeholder="Buscar servicio" autocomplete="off">
            </label>
          </div>

          <div id="filtros" class="filtros" role="group" aria-label="Filtrar por especialidad"></div>

          <div class="tarjeta overflow-hidden rounded-grande">
            <div class="fila-s h-9 border-b border-borde-default bg-fondo-sutil text-13 font-semibold text-texto-secundario" aria-hidden="true">
              <span>Servicio</span><span class="@max-2xl:hidden">Duración</span><span class="text-right">Precio</span><span class="text-right @max-2xl:hidden">Comisión</span><span class="text-right @max-2xl:hidden">Quién lo hace</span>
            </div>
            <div id="lista"></div>
            <div id="lista-estado" class="hidden px-4 py-10 text-center text-texto-secundario"></div>
          </div>
          <p class="px-1 text-13 text-texto-secundario">Precios con IVA. La comisión es sobre el precio sin IVA; en los precios "desde" sube con lo que se cobre.</p>
        </section>

        <!-- Panel derecho: detalle o formulario. En pantallas angostas se abre encima de la lista. -->
        <div id="fondo-panel" class="fixed inset-0 z-30 hidden bg-neutro-900/50 xl:hidden"></div>
        <aside id="panel" class="fixed inset-y-0 right-0 z-40 hidden w-full flex-col overflow-y-auto border-l border-borde-default bg-fondo-superficie sm:w-[400px] xl:sticky xl:top-16 xl:z-auto xl:flex xl:h-[calc(100dvh-4rem)] xl:w-auto" aria-label="Detalle del servicio"></aside>
      </main>
    </div>
  </div>

  <script type="module" src="js/controllersWeb/serviciosController.js"></script>
</body>
</html>
