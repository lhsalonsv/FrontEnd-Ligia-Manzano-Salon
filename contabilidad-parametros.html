<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contabilidad · Parámetros · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Sin diseño aprobado todavía: sigue el estilo de Bitácora (lista de solo lectura). Fuente: manual de anexos del F-07. -->
<!-- Sin diseño aprobado todavía: pestañas como Configuración, listas como Libros de IVA. Fuente: modelo/PLAN_CONTABILIDAD.md. -->
<body data-pagina="contabilidad" data-titulo="Contabilidad">

  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <main id="principal" class="flex-1">
        <section class="mx-auto flex w-full max-w-6xl min-w-0 flex-col gap-4 p-4 sm:px-8 sm:py-6" aria-label="Parámetros de contabilidad">
          <nav class="flex gap-2" aria-label="Contabilidad">
            <a href="partidas.html" class="btn btn-secundario h-9 px-3 text-sm">Partidas</a>
            <a href="reportes-contables.html" class="btn btn-secundario h-9 px-3 text-sm">Reportes</a>
            <a href="contabilidad-parametros.html" class="btn btn-primario h-9 px-3 text-sm" aria-current="page">Parámetros</a>
          </nav>

          <div id="pestanas" class="filtros" role="group" aria-label="Parámetros">
            <button type="button" class="filtro" data-pestana="cuentas" aria-pressed="true">Plan de cuentas</button>
            <button type="button" class="filtro" data-pestana="periodos" aria-pressed="false">Ejercicios y períodos</button>
            <button type="button" class="filtro" data-pestana="tipos" aria-pressed="false">Tipos de partida</button>
            <button type="button" class="filtro" data-pestana="config" aria-pressed="false">Configuración</button>
          </div>
          <div id="aviso-solo-lectura" class="aviso aviso-info hidden" role="status"></div>

          <section id="pestana-cuentas" aria-label="Plan de cuentas" class="min-w-0"><div class="flex min-w-0 flex-col gap-3">
            <div class="flex flex-wrap items-center gap-3">
              <label class="campo-caja h-9 min-h-0 w-full text-sm sm:w-72">
                <span class="sr-only">Buscar por código o nombre</span>
                <span id="icono-buscar" aria-hidden="true"></span>
                <input id="buscar" type="search" placeholder="Buscar por código o nombre" autocomplete="off">
              </label>
              <div class="ml-auto flex flex-wrap gap-2">
                <button type="button" id="expandir" class="btn btn-secundario h-9 px-3 text-sm">Expandir todo</button>
                <button type="button" id="contraer" class="btn btn-secundario h-9 px-3 text-sm">Contraer todo</button>
                <button type="button" id="descargar-excel" class="btn btn-secundario h-9 px-3 text-sm"></button>
                <button type="button" id="nueva-cuenta" class="btn btn-primario h-9 px-3 text-sm"></button>
              </div>
            </div>
            <div id="chips" class="flex flex-wrap gap-2" role="group" aria-label="Tipo de cuenta"></div>
            <p id="cuentas-resumen" class="text-13 text-texto-secundario tabular-nums" aria-live="polite"></p>
            <div class="tarjeta overflow-x-auto rounded-grande">
              <div class="min-w-[760px]">
                <div id="cuentas-cabecera" class="fila-cta h-9 border-b border-borde-default bg-fondo-sutil text-13 font-semibold text-texto-secundario" aria-hidden="true"></div>
                <div id="cuentas-lista"></div>
              </div>
              <div id="cuentas-estado" class="hidden px-4 py-10 text-center text-texto-secundario"></div>
            </div>
          </div></section>

          <section id="pestana-periodos" class="hidden min-w-0" aria-label="Ejercicios y períodos"></section>
          <section id="pestana-tipos" class="hidden min-w-0" aria-label="Tipos de partida"></section>
          <section id="pestana-config" class="hidden min-w-0" aria-label="Configuración contable"></section>
        </section>
      </main>
    </div>
  </div>

  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo"></dialog>

  <script type="module" src="js/controllersWeb/contabilidadParametrosController.js"></script>
</body>
</html>
