<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- data-pagina marca el ítem activo del menú; data-titulo va en la barra superior -->
<body data-pagina="inicio" data-titulo="Inicio">

  <!-- Plantilla de página interna: copiar este esqueleto para cada pantalla nueva -->
  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <main class="flex-1 p-4 sm:p-8">
        <section class="tarjeta max-w-3xl p-6">
          <h2 class="text-xl">Hola, <span id="saludo-nombre"></span></h2>
          <p class="mt-1 text-texto-secundario" id="saludo-fecha"></p>
          <div class="aviso aviso-info mt-6">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <p>El resumen del día (citas, ventas y facturas) se programa cuando se apruebe el diseño. Por ahora esta página sirve para probar el inicio de sesión, el menú y la barra superior.</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="js/controllersWeb/inicioController.js"></script>
</body>
</html>
