<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compras · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Referencia visual: ../diseno/pantallas/compras.html (Historial, Registrar, Proveedores, Nuevo proveedor) -->
<body data-pagina="compras" data-titulo="Compras">

  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <!-- Compras y Proveedores: lista a la izquierda, detalle en el panel -->
      <main id="vista-listas" class="flex-1 xl:grid xl:grid-cols-[minmax(0,1fr)_420px]">
        <section class="@container flex min-w-0 flex-col gap-3 p-4 sm:px-8 sm:py-6" aria-label="Compras y proveedores">
          <div class="flex flex-wrap items-center gap-3">
            <div id="vistas" class="segmento" role="group" aria-label="Ver">
              <button type="button" data-vista="compras" aria-pressed="true">Compras</button>
              <button type="button" data-vista="proveedores" aria-pressed="false">Proveedores</button>
            </div>
            <p id="resumen" class="text-15 text-texto-secundario tabular-nums"></p>
            <label class="campo-caja ml-auto h-10 min-h-0 w-full sm:w-64">
              <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span class="sr-only" id="etiqueta-buscar">Buscar compra</span>
              <input id="buscar" type="search" placeholder="Proveedor o n.º de compra" autocomplete="off" aria-labelledby="etiqueta-buscar">
            </label>
          </div>

          <!-- Compras -->
          <div id="seccion-compras" class="flex flex-col gap-3">
            <div id="aviso-bajo" class="aviso aviso-aviso hidden flex-wrap items-center" role="status"></div>
            <div class="flex flex-wrap items-end gap-3">
              <div id="filtros" class="filtros min-w-0 flex-1" role="group" aria-label="Filtrar compras">
                <button type="button" class="filtro" data-filtro="todas" aria-pressed="true">Todas <span></span></button>
                <button type="button" class="filtro" data-filtro="este-mes" aria-pressed="false">Este mes <span></span></button>
              </div>
              <label class="campo-caja h-9 min-h-0 w-full text-sm sm:w-auto">
                <span class="text-texto-secundario">Proveedor:</span>
                <select id="filtro-proveedor" class="font-semibold"><option value="">Todos</option></select>
              </label>
            </div>
            <div class="tarjeta overflow-hidden rounded-grande">
              <div class="fila-co h-9 border-b border-borde-default bg-fondo-sutil text-13 font-semibold text-texto-secundario" aria-hidden="true">
                <span>Compra</span><span>Proveedor</span><span class="@max-lg:hidden">Productos</span><span class="text-right">Total</span>
              </div>
              <div id="lista-compras"></div>
              <div id="compras-estado" class="hidden px-4 py-10 text-center text-texto-secundario"></div>
              <div id="cargar-mas" class="hidden border-t border-borde-default p-3 text-center">
                <button type="button" class="btn btn-secundario">Cargar más</button>
              </div>
            </div>
            <p class="px-1 text-13 text-texto-secundario">Total con IVA. Cada producto de una compra entra como un lote con su propio costo (PEPS).</p>
          </div>

          <!-- Proveedores -->
          <div id="seccion-proveedores" class="hidden flex-col gap-3">
            <div class="flex flex-wrap items-end gap-3">
              <div id="filtros-proveedor" class="filtros min-w-0 flex-1" role="group" aria-label="Filtrar proveedores">
                <button type="button" class="filtro" data-filtro="activos" aria-pressed="true">Activos <span></span></button>
                <button type="button" class="filtro" data-filtro="inactivos" aria-pressed="false">Inactivos <span></span></button>
              </div>
              <button type="button" id="btn-nuevo-proveedor" class="btn btn-secundario h-9 px-3 text-sm">
                <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Nuevo proveedor
              </button>
            </div>
            <div class="tarjeta overflow-hidden rounded-grande">
              <div class="fila-pr h-9 border-b border-borde-default bg-fondo-sutil text-13 font-semibold text-texto-secundario" aria-hidden="true">
                <span>Proveedor</span><span class="@max-2xl:hidden">Contacto</span><span class="@max-md:hidden">Crédito</span><span class="text-right">Última compra</span>
              </div>
              <div id="lista-proveedores"></div>
              <div id="proveedores-estado" class="hidden px-4 py-10 text-center text-texto-secundario"></div>
            </div>
          </div>
        </section>

        <!-- Panel derecho: compra, proveedor o formulario. En pantallas angostas se abre encima de la lista. -->
        <div id="fondo-panel" class="fixed inset-0 z-30 hidden bg-neutro-900/50 xl:hidden"></div>
        <aside id="panel" class="fixed inset-y-0 right-0 z-40 hidden w-full flex-col overflow-y-auto border-l border-borde-default bg-fondo-superficie sm:w-[440px] xl:sticky xl:top-16 xl:z-auto xl:flex xl:h-[calc(100dvh-4rem)] xl:w-auto" aria-label="Detalle"></aside>
      </main>

      <!-- Registrar compra: reemplaza a la lista. El formulario ocupa la zona principal y el resumen va a la derecha
          (abajo en pantallas angostas). Se oculta con el atributo hidden y no con la clase: la clase pierde contra xl:grid. -->
      <main id="vista-registrar" class="flex-1 xl:grid xl:grid-cols-[minmax(0,1fr)_420px]" hidden></main>
    </div>
  </div>

  <script type="module" src="js/controllersWeb/comprasController.js"></script>
</body>
</html>
