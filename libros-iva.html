<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libros de IVA · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Sin diseño aprobado todavía: sigue el estilo de Bitácora (lista de solo lectura). Fuente: manual de anexos del F-07. -->
<body data-pagina="libros-iva" data-titulo="Libros de IVA">

  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <main id="principal" class="flex-1">
        <section class="@container mx-auto flex w-full max-w-6xl min-w-0 flex-col gap-4 p-4 sm:px-8 sm:py-6" aria-label="Libros de IVA del mes">
          <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-1">
              <button type="button" id="mes-anterior" class="btn btn-secundario size-9 p-0" aria-label="Mes anterior"></button>
              <button type="button" id="mes-siguiente" class="btn btn-secundario size-9 p-0" aria-label="Mes siguiente"></button>
            </div>
            <h2 id="titulo-mes" class="text-xl first-letter:uppercase"></h2>
            <label class="campo-caja h-9 min-h-0 w-auto text-sm">
              <span class="sr-only">Elegir mes</span>
              <input id="mes" type="month" class="tabular-nums">
            </label>
          </div>

          <div id="resumen" class="grid gap-3 @lg:grid-cols-3" aria-live="polite"></div>
          <div id="aviso" class="aviso aviso-aviso hidden" role="status"></div>

          <div class="flex flex-wrap items-center gap-3">
            <div id="libros" class="segmento max-w-full overflow-x-auto" role="group" aria-label="Libro"></div>
            <div class="ml-auto flex flex-wrap gap-2">
              <button type="button" id="descargar-csv" class="btn btn-secundario h-9 px-3 text-sm"></button>
              <button type="button" id="descargar-excel" class="btn btn-secundario h-9 px-3 text-sm"></button>
              <button type="button" id="imprimir" class="btn btn-secundario h-9 px-3 text-sm"></button>
            </div>
          </div>

          <div class="tarjeta overflow-hidden rounded-grande">
            <div id="cabecera" class="fila-iva h-9 border-b border-borde-default bg-fondo-sutil text-13 font-semibold text-texto-secundario" aria-hidden="true"></div>
            <div id="lista"></div>
            <div id="lista-estado" class="hidden px-4 py-10 text-center text-texto-secundario"></div>
            <div id="totales" class="fila-iva hidden min-h-12 border-t border-borde-default bg-fondo-sutil py-2 text-15 font-semibold tabular-nums"></div>
          </div>
          <p id="nota" class="px-1 text-13 text-texto-secundario"></p>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="js/controllersWeb/librosIvaController.js"></script>
</body>
</html>
