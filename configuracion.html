<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuración · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Referencia visual: ../diseno/pantallas/configuracion.html (Negocio y Hacienda, Reglas del salón, Usuarios y roles) -->
<body data-pagina="configuracion" data-titulo="Configuración">

  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <!-- Como el mockup: en pantalla ancha, secciones a la izquierda (220 px) y el contenido usa el resto -->
      <main id="principal" class="flex flex-1 flex-col gap-4 p-4 sm:px-8 sm:py-6 xl:grid xl:grid-cols-[220px_minmax(0,1fr)] xl:items-start xl:gap-6">
        <nav class="flex flex-col gap-2 xl:sticky xl:top-22" aria-label="Secciones de configuración">
          <div id="secciones" class="filtros secciones min-w-0" role="group" aria-label="Secciones">
            <button type="button" class="filtro" data-seccion="negocio" aria-pressed="true">Negocio y Hacienda</button>
            <button type="button" class="filtro" data-seccion="reglas" aria-pressed="false">Reglas del salón</button>
            <button type="button" class="filtro" data-seccion="usuarios" aria-pressed="false">Usuarios y roles</button>
          </div>
          <p class="flex items-start gap-2 text-13 text-texto-secundario xl:mt-2 xl:px-3">
            <svg class="icono mt-0.5 size-4" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Solo la administradora entra aquí. Cada cambio queda en la bitácora.
          </p>
        </nav>

        <!-- Cada sección la dibuja el controlador -->
        <div class="flex min-w-0 flex-col">
          <section id="seccion-negocio" aria-label="Negocio y Hacienda"></section>
          <section id="seccion-reglas" class="hidden" aria-label="Reglas del salón"></section>
          <section id="seccion-usuarios" class="hidden" aria-label="Usuarios y roles"></section>
        </div>
      </main>
    </div>
  </div>

  <!-- Nuevo / editar usuario y la contraseña temporal. <dialog> ya trae el foco atrapado, Esc y el fondo oscuro. -->
  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo"></dialog>

  <script type="module" src="js/controllersWeb/configuracionController.js"></script>
</body>
</html>
