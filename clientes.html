<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes · Ligia Manzano Salón</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Referencia visual: ../diseno/pantallas/clientes.html (Ficha, Nuevo cliente, Nuevo cliente con crédito fiscal) -->
<body data-pagina="clientes" data-titulo="Clientes">

  <div class="lg:grid lg:min-h-dvh lg:grid-cols-[248px_1fr]">
    <aside id="lateral" class="fixed inset-y-0 left-0 z-40 flex w-[248px] -translate-x-full flex-col gap-6 overflow-y-auto bg-lateral-fondo px-4 py-6 text-lateral-texto transition-transform lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0"></aside>
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-neutro-900/50 lg:hidden"></div>

    <div class="flex min-w-0 flex-col">
      <header id="barra" class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-borde-default bg-fondo-superficie px-4 sm:px-8"></header>

      <main class="flex-1 xl:grid xl:grid-cols-[1fr_380px]">
        <!-- Lista -->
        <section class="@container flex min-w-0 flex-col gap-3 p-4 sm:px-8 sm:py-6" aria-label="Lista de clientes">
          <div class="flex flex-wrap items-center gap-3">
            <p id="resumen" class="text-15 whitespace-nowrap text-texto-secundario tabular-nums" aria-live="polite"></p>
            <label class="campo-caja ml-auto h-10 min-h-0 w-full sm:w-72">
              <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span class="sr-only">Buscar cliente</span>
              <input id="buscar" type="search" placeholder="Nombre, teléfono o DUI" autocomplete="off">
            </label>
          </div>

          <div class="filtros" role="group" aria-label="Filtrar clientes">
            <button type="button" class="filtro" data-filtro="todos" aria-pressed="true">Todos <span></span></button>
            <button type="button" class="filtro" data-filtro="este-mes" aria-pressed="false">Vinieron este mes <span></span></button>
            <button type="button" class="filtro" data-filtro="sin-venir-60" aria-pressed="false">Sin venir hace 60 días <span></span></button>
            <button type="button" class="filtro" data-filtro="cumple-mes" aria-pressed="false"><b id="etiqueta-cumple" class="font-semibold">Cumpleaños del mes</b> <span></span></button>
          </div>

          <div class="tarjeta overflow-hidden rounded-grande">
            <div class="fila-cli h-9 border-b border-borde-default bg-fondo-sutil text-13 font-semibold text-texto-secundario" aria-hidden="true">
              <span>Cliente</span><span class="@max-2xl:hidden">Última visita</span><span class="text-right @max-2xl:hidden">Visitas</span><span class="text-right @max-2xl:hidden">Gastado</span><span class="@max-sm:hidden">Próxima cita</span>
            </div>
            <ul id="lista" aria-label="Clientes"></ul>
            <div id="lista-estado" class="hidden px-4 py-10 text-center text-texto-secundario"></div>
            <div id="cargar-mas" class="hidden border-t border-borde-default p-3 text-center">
              <button type="button" class="btn btn-secundario">Cargar más</button>
            </div>
          </div>
          <p class="px-1 text-13 text-texto-secundario">Visitas y gastado: últimos 12 meses. El punto naranja indica una alergia registrada.</p>
        </section>

        <!-- Panel derecho: ficha o formulario. En pantallas angostas se abre encima de la lista. -->
        <div id="fondo-panel" class="fixed inset-0 z-30 hidden bg-neutro-900/50 xl:hidden"></div>
        <aside id="panel" class="fixed inset-y-0 right-0 z-40 hidden w-full flex-col overflow-y-auto border-l border-borde-default bg-fondo-superficie sm:w-[400px] xl:sticky xl:top-16 xl:z-auto xl:flex xl:h-[calc(100dvh-4rem)] xl:w-auto" aria-label="Ficha del cliente"></aside>
      </main>
    </div>
  </div>

  <script type="module" src="js/controllersWeb/clientesController.js"></script>
</body>
</html>
